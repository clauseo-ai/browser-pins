# Unit tests and shell syntax for pull requests and pushes to main.
# No secrets, no environment: this workflow must never sign anything.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest -v

      - name: Shell syntax
        run: bash -n scripts/*.sh
