# SPDX-License-Identifier: GPL-3.0-or-later
# Build and publish the Clauseo browser pins v1 (format: SPEC.md), in two jobs.
#
#   build    no environment and no secrets. Builds and checks the manifest, uploads it as an artifact.
#   publish  the `signing` environment, the only place the signing secret is. It fetches and verifies the
#            current assets itself, re-checks the artifact with build.py --validate, signs, verifies, uploads.
#
# Any failing step stops the run before the upload, so the current assets stay.
name: publish

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
    inputs:
      allow_downgrade:
        description: 'Publish even though Google lists a lower Stable version (owner only; only for a pulled release)'
        type: boolean
        default: false
      recover_incomplete:
        description: 'Treat a release with an incomplete asset pair as a first run and replace it (owner only)'
        type: boolean
        default: false

concurrency:
  group: publish-browser-pins
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Owner-only flags
        env:
          ACTOR: ${{ github.triggering_actor }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          RECOVER_INCOMPLETE: ${{ inputs.recover_incomplete }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != ro-hansolo ] && { [ "$ALLOW_DOWNGRADE" = true ] || [ "$RECOVER_INCOMPLETE" = true ]; }; then
            echo "::error::allow_downgrade and recover_incomplete are owner-only; this run was started by $ACTOR"
            exit 1
          fi

      - name: Require the public keys
        run: |
          set -euo pipefail
          for key in minisign.pub minisign-next.pub; do
            if [ ! -s "$key" ]; then
              echo "::error::$key is missing or empty; refusing to build or publish"
              echo "**Failed:** $key is missing from the repo. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      - name: Install minisign
        env:
          MINISIGN_VERSION: '0.11'
          MINISIGN_SHA256: 'f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/minisign.tar.gz" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  $tmp/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/minisign.tar.gz" -C "$tmp" minisign-linux/x86_64/minisign
          sudo install -m 0755 "$tmp/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          rm -rf "$tmp"
          minisign -v

      - name: Unit tests
        run: python3 -m unittest -v

      - name: Fetch and verify the current assets
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECOVER_INCOMPLETE: ${{ inputs.recover_incomplete }}
        run: |
          set -euo pipefail
          path=$(scripts/fetch-current.sh "$RUNNER_TEMP/current")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          CURRENT: ${{ steps.current.outputs.path }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          args=("$CURRENT" --out-dir "$OUT")
          if [ "$ALLOW_DOWNGRADE" = true ]; then
            args+=(--allow-downgrade)
          fi
          python3 build.py "${args[@]}"

      - name: Upload the new manifest
        if: steps.build.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-pins-v1
          path: out/browser-pins-v1.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: signing
    permissions:
      contents: write
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Owner-only flags
        env:
          ACTOR: ${{ github.triggering_actor }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          RECOVER_INCOMPLETE: ${{ inputs.recover_incomplete }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != ro-hansolo ] && { [ "$ALLOW_DOWNGRADE" = true ] || [ "$RECOVER_INCOMPLETE" = true ]; }; then
            echo "::error::allow_downgrade and recover_incomplete are owner-only; this run was started by $ACTOR"
            exit 1
          fi

      - name: Require the public keys
        run: |
          set -euo pipefail
          for key in minisign.pub minisign-next.pub; do
            if [ ! -s "$key" ]; then
              echo "::error::$key is missing or empty; refusing to build or publish"
              echo "**Failed:** $key is missing from the repo. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      - name: Install minisign
        env:
          MINISIGN_VERSION: '0.11'
          MINISIGN_SHA256: 'f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/minisign.tar.gz" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  $tmp/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/minisign.tar.gz" -C "$tmp" minisign-linux/x86_64/minisign
          sudo install -m 0755 "$tmp/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          rm -rf "$tmp"
          minisign -v

      - name: Fetch and verify the current assets
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECOVER_INCOMPLETE: ${{ inputs.recover_incomplete }}
        run: |
          set -euo pipefail
          path=$(scripts/fetch-current.sh "$RUNNER_TEMP/current")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Download the new manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-pins-v1
          path: out

      - name: Validate the new manifest (checks Google's listed version and file sizes)
        id: validate
        env:
          CURRENT: ${{ steps.current.outputs.path }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          args=("$OUT/browser-pins-v1.json" "$CURRENT")
          if [ "$ALLOW_DOWNGRADE" = true ]; then
            args+=(--allow-downgrade)
          fi
          python3 build.py --validate "${args[@]}"

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TRUSTED_COMMENT: ${{ steps.validate.outputs.trusted_comment }}
        run: KEY_FILE="$RUNNER_TEMP/minisign.key" scripts/sign.sh "$OUT/browser-pins-v1.json" "$TRUSTED_COMMENT"

      - name: Delete the secret key
        if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"

      - name: Verify
        env:
          TRUSTED_COMMENT: ${{ steps.validate.outputs.trusted_comment }}
        run: scripts/verify.sh "$OUT/browser-pins-v1.json" "$OUT/browser-pins-v1.json.minisig" "$TRUSTED_COMMENT"

      - name: Upload to the current release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view current >/dev/null 2>&1; then
            gh release create current \
              --title "Clauseo browser pins" \
              --notes "The signed Clauseo browser pins (Chrome for Testing builds, format: SPEC.md), refreshed every 3 hours. Its two assets are replaced in place on each run. How to verify: https://github.com/${GH_REPO}#readme" \
              --target "$GITHUB_SHA"
          fi
          # Uploads under temporary names, then swaps each asset into place (scripts/replace-assets.sh).
          scripts/replace-assets.sh current "$OUT/browser-pins-v1.json" "$OUT/browser-pins-v1.json.minisig"
          echo "Published to release \`current\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Run summary
        if: always()
        env:
          PUBLISH: ${{ needs.build.outputs.publish || 'not reached' }}
          VERSION: ${{ steps.validate.outputs.version || '-' }}
        run: |
          {
            echo "## Clauseo browser pins run"
            echo ""
            echo "- publish: \`$PUBLISH\`"
            echo "- version: \`$VERSION\`"
            echo "- run: \`$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
